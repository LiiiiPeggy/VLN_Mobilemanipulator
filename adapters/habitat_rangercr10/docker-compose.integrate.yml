# ################################
# Main-session integrate runtime (single workspace).
# Mounts /home/ubuntu/locomani/VLN_Mobilemanipulator only.
# agentA/agentB isolation trees retired — do not reuse their containers.
# Private catkin devel: .catkin_devel_integrate under this repo root.
# ################################
services:
  vln-rangercr10-integrate:
    image: vln-rangercr10:agentA-from-shared
    container_name: vln-rangercr10-integrate
    runtime: nvidia
    network_mode: host
    working_dir: /workspace/VLN_Mobilemanipulator
    volumes:
      - /home/ubuntu/locomani/VLN_Mobilemanipulator:/workspace/VLN_Mobilemanipulator
      # ################################
      # Editable groundingdino from shared install (read-only).
      # ################################
      - /home/ubuntu/locomani/VLN_Mobilemanipulator/baselines/ApexNav/GroundingDINO:/workspace/VLN_Mobilemanipulator/baselines/ApexNav/GroundingDINO:ro
      - /media/ubuntu/D/VLN_shared:/media/ubuntu/D/VLN_shared
      - /home/ubuntu/locomani/LocoManip_Lab:/workspace/LocoManip_Lab:ro
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
      - PYTHONPATH=/workspace/VLN_Mobilemanipulator/adapters/habitat_rangercr10
      - CATKIN_DEVEL_PREFIX=/workspace/VLN_Mobilemanipulator/.catkin_devel_integrate
    command: sleep infinity
    stdin_open: true
    tty: true

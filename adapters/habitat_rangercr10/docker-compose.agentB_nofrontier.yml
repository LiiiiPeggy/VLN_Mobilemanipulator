# ################################
# Agent B private runtime for NoFrontierLook pairing.
# - Own container name (never reuse vln-rangercr10-agentA-navinf).
# - Mount ONLY the B clone as VLN tree; do NOT bind-mount ApexNav onto
#   /workspace/ApexNav (that makes run_apexnav_real_episode.sh's rm -rf unsafe).
# - ApexNav is reached via a symlink created by ensure_apex_symlink_safe.sh.
# - Private devel lives under the B clone (via symlink) or CATKIN_DEVEL_PREFIX.
# ################################
services:
  vln-rangercr10-agentB-nofrontier:
    image: vln-rangercr10:bullet
    container_name: vln-rangercr10-agentB-nofrontier
    runtime: nvidia
    # host network: Habitat/VLM/ROS ports on localhost after B holds host lock
    network_mode: host
    working_dir: /workspace/VLN_Mobilemanipulator
    volumes:
      - /home/ubuntu/locomani/B_VLN_Mobilemanipulator:/workspace/VLN_Mobilemanipulator
      # ################################
      # Editable groundingdino maps to /workspace/ApexNav/GroundingDINO (via symlink).
      # Mount shared install so B clone need not vendor the package.
      # ################################
      - /home/ubuntu/locomani/VLN_Mobilemanipulator/baselines/ApexNav/GroundingDINO:/workspace/VLN_Mobilemanipulator/baselines/ApexNav/GroundingDINO:ro
      - /media/ubuntu/D/VLN_shared:/media/ubuntu/D/VLN_shared
      - /home/ubuntu/locomani/LocoManip_Lab:/workspace/LocoManip_Lab:ro
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
      - PYTHONPATH=/workspace/VLN_Mobilemanipulator/adapters/habitat_rangercr10
      - CATKIN_DEVEL_PREFIX=/workspace/VLN_Mobilemanipulator/.catkin_devel_agentB
    command: sleep infinity
    stdin_open: true
    tty: true
